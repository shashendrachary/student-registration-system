<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Student Registration System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="top-actions">
    <span class="signed-in">Admin: {{ user_email }}</span>
    <button id="themeToggle" class="theme-toggle" type="button">Dark</button>
    <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
  </div>

  <header class="hero">
    <h1>Admin Dashboard</h1>
  </header>

  <main class="layout">
    <section class="card table-card">
      <h2>Recently Updated Students</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>HT No</th>
              <th>Name</th>
              <th>Program</th>
              <th>Official Email</th>
              <th>Mobile</th>
              <th>Status</th>
              <th>Updated At</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="adminStudentsBody"></tbody>
        </table>
      </div>
      <p id="adminMessage" class="auth-message"></p>
    </section>
  </main>

  <div id="studentDetailModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card detail-card">
      <div class="section-head">
        <h3>Student Details</h3>
        <button id="closeDetailModal" class="mini-btn" type="button">Close</button>
      </div>
      <div id="studentDetailContent" class="detail-grid"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
